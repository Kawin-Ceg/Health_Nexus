[project]
name = "healthnexus-ml"
version = "0.1.0"
description = "HealthNexus anomaly detection and outbreak clustering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["healthnexus_ml"]
